name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci .
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Shell scripts
        run: shellcheck -S warning setup-mac.sh reset-mac.sh setup-linux.sh docker/entrypoint.sh scripts/smoke.sh

  monitoring:
    name: Prometheus config and queries
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.5.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Prometheus
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar xz
          echo "$PWD/prometheus-${PROMETHEUS_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - name: Generate and validate config
        run: |
          npm run check:monitoring
          promtool check config .tmp/monitoring/prometheus.yml
      - name: Validate every PromQL expression
        run: |
          printf 'global:\n  scrape_interval: 15s\n' > /tmp/empty.yml
          prometheus --config.file=/tmp/empty.yml --storage.tsdb.path=/tmp/tsdb --web.listen-address=127.0.0.1:9090 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9090/-/ready && break; sleep 1; done
          PROM_URL=http://127.0.0.1:9090 npx tsx scripts/check-monitoring.ts .tmp/monitoring

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagrams are up to date
        run: |
          npm run diagrams
          git diff --exit-code docs/public/diagrams || (echo "::error::Run npm run diagrams and commit the result" && exit 1)
      - run: npm run docs:build

  docker:
    name: Docker image (build, set up, restart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: homeport:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start
        # Published ports make the test traffic come from the Docker bridge, like a browser on the LAN.
        run: docker run -d --name homeport -p 7070:7070 -v hp-data:/data -v hp-apps:/apps homeport:ci
      - name: Tools in the image
        run: |
          docker exec homeport caddy version
          docker exec homeport cloudflared --version
          docker exec homeport prometheus --version
          docker exec homeport node_exporter --version
          docker exec homeport git --version
      - name: First setup with the code from the container log
        run: |
          bash scripts/smoke.sh setup http://127.0.0.1:7070 docker "docker exec homeport cat /data/setup-code"
          docker logs homeport 2>&1 | grep -q "setup code" || (echo "::error::Setup code not in the container log" && exit 1)
      - name: Survives a restart
        run: |
          docker restart homeport
          bash scripts/smoke.sh resumed http://127.0.0.1:7070
      - name: Container log
        if: always()
        run: docker logs homeport 2>&1 | tail -80

  installer:
    name: Linux installer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          set -o pipefail
          if ! bash setup-linux.sh 2>&1 | tee /tmp/install.log; then
            echo "::error title=setup-linux.sh failed::$(tail -30 /tmp/install.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.homeport/bin" >> "$GITHUB_PATH"
      - name: First setup from another address
        run: |
          ip=$(hostname -I | awk '{print $1}')
          bash scripts/smoke.sh setup "http://$ip:7070" linux "cat data/setup-code"
      - name: Survives pm2 being killed and resurrected (a reboot)
        run: |
          pm2 kill
          pm2 resurrect
          bash scripts/smoke.sh resumed "http://$(hostname -I | awk '{print $1}'):7070"
      - name: pm2 state
        if: always()
        run: pm2 ls && pm2 logs homeport --lines 40 --nostream
